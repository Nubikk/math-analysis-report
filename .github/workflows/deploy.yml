name: Deploy Slidev to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Разворачиваем pnpm в окружении GitHub Actions
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      # Одобряем выполнение бинарных скриптов (необходимо для esbuild)
      - name: Approve pnpm builds
        run: pnpm approve-builds

      - name: Install dependencies
        run: pnpm install

      # Сборка монолитного лонгрида (без презентационных панелей и кнопок)
      - name: Build Slidev SPA
        run: pnpm run build -- --entry doc

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4